name: Build fcode-utils

on: [push, workflow_dispatch]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    name: fcode-utils for x86_64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout fcode-utils
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=master
            type=sha

      - name: Build fcode-utils
        uses: docker://ghcr.io/retrochristian5000/fcode-utils-builder:master
        with:
          args: "bash -c \"mkdir -p $(pwd)/build-$(uname -m) && make && make DESTDIR=$(pwd)/build-$(uname -m) install\""

      - name: Verify incremental toke dependencies
        uses: docker://ghcr.io/retrochristian5000/fcode-utils-builder:master
        with:
          args: "bash -c \"set -eu; make -C toke HOSTCC=gcc -q; touch shared/classcodes.c; make -C toke HOSTCC=gcc -n > /tmp/toke-dry-run; cat /tmp/toke-dry-run; grep -q 'classcodes.o' /tmp/toke-dry-run; if grep -q 'scanner.o' /tmp/toke-dry-run; then echo 'unrelated toke object rebuilt' >&2; exit 1; fi; make -C toke HOSTCC=gcc; make -C toke HOSTCC=gcc -q\""

      - name: Copy localvalues
        uses: docker://ghcr.io/retrochristian5000/fcode-utils-builder:master
        with:
          args: "bash -c \"cp -R localvalues build-$(uname -m)\""

      - name: Store x86_64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fcode-utils-x86_64
          path: build-x86_64

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
